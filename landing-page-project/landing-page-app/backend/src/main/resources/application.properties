# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Oracle DataSource
# Replace HOST, PORT, SERVICE_NAME, USER, PASSWORD with your own values
# ===============================
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
spring.datasource.username=landing_app
spring.datasource.password=change_me
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# 'update' auto-creates/updates tables from your entities during development.
# Switch to 'validate' or 'none' once you manage schema via database/schema.sql in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Connection pool (HikariCP - bundled with Spring Boot)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
